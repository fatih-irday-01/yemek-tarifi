# ─────────────────────────────────────────────────────────────
# Workspace Konfigürasyonu
# Proje başına bir kez doldur, commit'le.
# ─────────────────────────────────────────────────────────────

# Mod: auto | monorepo | multirepo
#
#   auto      → Otomatik tespit:
#               backend/ ve frontend/ alt dizinleri varsa monorepo,
#               BACKEND_REPO ve FRONTEND_REPO tanımlıysa multirepo,
#               ikisi de yoksa simple (tek repo, worktree yok)
#
#   monorepo  → Aynı repo, backend/ ve frontend/ alt dizinleri var.
#               Her göreve git worktree oluşturulur.
#
#   multirepo → Ayrı repolar. BACKEND_REPO ve FRONTEND_REPO zorunlu.
#
WORKSPACE_MODE=auto

# ── Monorepo ayarları ─────────────────────────────────────────
# backend ve frontend'in proje köküne göre yolları
BACKEND_PATH=./backend
FRONTEND_PATH=./frontend

# Git worktree'lerin oluşturulacağı dizin
WORKTREE_DIR=.worktrees

# ── Multirepo ayarları ────────────────────────────────────────
# Ayrı repo mutlak yolları (WORKSPACE_MODE=multirepo ise zorunlu)
# BACKEND_REPO=/Users/macos/Projects/my-api
# FRONTEND_REPO=/Users/macos/Projects/my-frontend

# ── Genel ────────────────────────────────────────────────────
# Claude başlangıç bekleme süresi (saniye)
# Düşük bağlantıda veya ilk açılışta artır
CLAUDE_WAIT=8
